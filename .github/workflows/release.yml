name: Build and Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (optional for manual runs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: android-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' package no longer exists in sdkmanager and breaks the default install
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Prepare signing and build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG_NAME="${{ inputs.tag }}"
            else
              TAG_NAME="v1.0.${{ github.run_number }}"
            fi
          fi
          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets in the android-release environment."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release-upload-key.jks"
          export KEYSTORE_PATH="${{ runner.temp }}/release-upload-key.jks"
          gradle :app:assembleRelease
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_OUT="Chatso-${TAG_NAME}-release.apk"

          cp "$APK_SRC" "$APK_OUT"
          echo "apk_path=${APK_OUT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: Chatso ${{ steps.build.outputs.release_tag }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk_path }}
