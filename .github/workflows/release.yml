name: Build and Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (optional for manual runs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: android-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' package no longer exists in sdkmanager and breaks the default install
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: |
          if gradle :app:testDebugUnitTest; then
            exit 0
          fi

          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not reports:
              print("No unit-test XML reports were generated.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is not None:
                      print(f"FAILED: {case.get('classname')}::{case.get('name')}")
                      print(failure.get("message", ""))
                      print(failure.text or "")
          PY
          exit 1

      - name: Prepare signing and build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG_NAME="${{ inputs.tag }}"
            else
              TAG_NAME="v1.0.${{ github.run_number }}"
            fi
          fi
          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          rm -rf release-apks
          mkdir -p release-apks
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release-upload-key.jks"
            export KEYSTORE_PATH="${{ runner.temp }}/release-upload-key.jks"
            gradle :app:assembleRelease
            for apk in $(find app/build/outputs/apk/release -name "*.apk" | sort); do
              base=$(basename "$apk")
              abi=$(echo "$base" | sed -E 's/^app-(.+)-release\.apk$/\1/')
              if [ "$abi" != "$base" ]; then
                cp "$apk" "release-apks/Chatso-${TAG_NAME}-${abi}-release.apk"
              else
                cp "$apk" "release-apks/Chatso-${TAG_NAME}-release.apk"
              fi
            done
          else
            echo "Release signing secrets not configured; building debug APKs."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            gradle :app:assembleDebug
            for apk in $(find app/build/outputs/apk/debug -name "*.apk" | sort); do
              base=$(basename "$apk")
              abi=$(echo "$base" | sed -E 's/^app-(.+)-debug\.apk$/\1/')
              if [ "$abi" != "$base" ]; then
                cp "$apk" "release-apks/Chatso-${TAG_NAME}-${abi}-debug.apk"
              else
                cp "$apk" "release-apks/Chatso-${TAG_NAME}-debug.apk"
              fi
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: Chatso ${{ steps.build.outputs.release_tag }}
          generate_release_notes: true
          files: release-apks/*.apk
